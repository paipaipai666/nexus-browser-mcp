<!DOCTYPE html><html><head><meta charset="utf-8"><title>Login</title></head><body>
<div id="flash" style="display:none"></div>
<form id="login" onsubmit="return false" style="display:block">
<input id="username" placeholder="用户名"><input id="password" type="password" placeholder="密码">
<button type="submit">登录</button></form>
<div id="secure" style="display:none"><h2>安全区</h2><a class="button" id="logout" href="#">登出</a></div>
<script>
const f = document.getElementById("flash");
document.querySelector("#login button").addEventListener("click", () => {
  const u = document.getElementById("username").value, p = document.getElementById("password").value;
  if (u === "tomsmith" && p === "SuperSecretPassword!") {
    history.pushState({}, "", "#secure");
    document.getElementById("login").style.display = "none";
    document.getElementById("secure").style.display = "block";
    f.textContent = "You logged in!"; f.style.display = "block";
  } else { f.textContent = "无效凭据"; f.style.display = "block"; }
});
document.getElementById("logout").addEventListener("click", (e) => {
  e.preventDefault();  // href="#" 默认跳转会把 hash 清成空串
  history.pushState({}, "", "#login");
  document.getElementById("secure").style.display = "none";
  document.getElementById("login").style.display = "block";
});
</script></body></html>
