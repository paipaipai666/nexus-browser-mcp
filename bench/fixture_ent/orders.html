<!DOCTYPE html><html><head><meta charset="utf-8"><title>订单管理</title></head><body>
<h1>订单管理台</h1>
<input id="q" placeholder="按客户名过滤">
<select id="st"><option value="">全部状态</option><option>待处理</option><option>已发货</option><option>已完成</option></select>
<table id="t"><thead><tr><th id="thAmt">金额 ↕</th><th>客户</th><th>状态</th></tr></thead><tbody></tbody></table>
<script>
const NAMES = ["张伟","王芳","李娜","刘强","陈静","杨洋","赵磊","孙丽","周杰","吴敏","郑爽","冯晨","褚燕","卫东","蒋涵"];
const STS = ["待处理","已发货","已完成"];
let rows = [];
for (let i = 0; i < 30; i++) rows.push({
  name: NAMES[Math.floor(Math.random()*NAMES.length)],
  amt: Math.floor(Math.random()*989)+10,
  st: STS[Math.floor(Math.random()*3)]
});
let sortDesc = null;
function render() {
  const q = document.getElementById("q").value.trim();
  const st = document.getElementById("st").value;
  let v = rows.filter(r => (!q || r.name.includes(q)) && (!st || r.st === st));
  if (sortDesc !== null) v = [...v].sort((a,b) => sortDesc ? b.amt - a.amt : a.amt - b.amt);
  const tb = document.querySelector("#t tbody");
  tb.innerHTML = "";
  v.forEach(r => { const tr = document.createElement("tr");
    tr.innerHTML = `<td>${r.amt}</td><td>${r.name}</td><td>${r.st}</td>`; tb.appendChild(tr); });
  document.title = `订单管理 (${v.length})`;
}
document.getElementById("q").addEventListener("input", render);
document.getElementById("st").addEventListener("change", render);
document.getElementById("thAmt").addEventListener("click", () => {
  sortDesc = sortDesc === null ? true : !sortDesc; render();
  document.getElementById("thAmt").dataset.sorted = sortDesc ? "desc" : "asc";
});
render();
</script></body></html>
