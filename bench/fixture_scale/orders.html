<!DOCTYPE html><html><head><meta charset="utf-8"><title>订单管理</title></head><body>
<h1>订单管理台</h1>
<input id="q" placeholder="按客户名过滤">
<select id="st"><option value="">全部状态</option><option>待处理</option><option>已发货</option><option>已完成</option><option>已取消</option></select>
<table id="t"><thead><tr><th id="thAmt">金额 ↕</th><th id="thName">客户 ↕</th><th>状态</th></tr></thead><tbody></tbody></table>
<div id="pager"></div>
<script>
const seed = parseInt(new URLSearchParams(location.search).get("seed") || "1");
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(seed);
const NAMES = ["张伟","王芳","李娜","刘强","陈静","杨洋","赵磊","孙丽","周杰","吴敏","郑爽","冯晨","褚燕","卫东","蒋涵"];
const STS = ["待处理","已发货","已完成","已取消"];
const PER = 10;
let rows = [];
for (let i = 0; i < 60; i++) rows.push({
  id: "SO-" + (1001 + i),
  name: NAMES[Math.floor(rnd()*NAMES.length)],
  amt: Math.floor(rnd()*989)+10,
  st: STS[Math.floor(rnd()*4)]
});
window.__truth = rows;
let sortKey = null, sortDesc = true, page = 1;
function filtered() {
  const q = document.getElementById("q").value.trim();
  const st = document.getElementById("st").value;
  let v = rows.filter(r => (!q || r.name.includes(q)) && (!st || r.st === st));
  if (sortKey === "amt") v = [...v].sort((a,b) => sortDesc ? b.amt - a.amt : a.amt - b.amt);
  if (sortKey === "name") v = [...v].sort((a,b) => sortDesc ? b.name.localeCompare(a.name,"zh") : a.name.localeCompare(b.name,"zh"));
  return v;
}
function render() {
  const v = filtered();
  const pages = Math.max(1, Math.ceil(v.length / PER));
  if (page > pages) page = pages;
  const tb = document.querySelector("#t tbody");
  tb.innerHTML = "";
  v.slice((page-1)*PER, page*PER).forEach(r => { const tr = document.createElement("tr");
    tr.innerHTML = `<td>${r.id}</td><td>${r.amt}</td><td>${r.name}</td><td>${r.st}</td>`; tb.appendChild(tr); });
  const pg = document.getElementById("pager");
  pg.innerHTML = "";
  for (let p = 1; p <= pages; p++) { const b = document.createElement("button");
    b.textContent = "第" + p + "页"; b.dataset.p = p;
    if (p === page) b.disabled = true;
    b.addEventListener("click", () => { page = p; render(); });
    pg.appendChild(b); }
  document.title = `订单管理 (${v.length}条 第${page}/${pages}页)`;
}
document.getElementById("q").addEventListener("input", () => { page = 1; render(); });
document.getElementById("st").addEventListener("change", () => { page = 1; render(); });
document.getElementById("thAmt").addEventListener("click", () => {
  sortDesc = sortKey === "amt" ? !sortDesc : true; sortKey = "amt"; render();
  document.getElementById("thAmt").dataset.sorted = sortDesc ? "desc" : "asc";
});
document.getElementById("thName").addEventListener("click", () => {
  sortDesc = sortKey === "name" ? !sortDesc : true; sortKey = "name"; render();
  document.getElementById("thName").dataset.sorted = sortDesc ? "desc" : "asc";
});
render();
</script></body></html>
