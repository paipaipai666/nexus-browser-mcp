<!DOCTYPE html><html><head><meta charset="utf-8"><title>知识库</title></head><body>
<h1>内部知识库</h1>
<div id="arts"></div>
<script>
const seed = parseInt(new URLSearchParams(location.search).get("seed") || "1");
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(seed);
const OWNERS = ["张伟","王芳","李娜","刘强","陈静","杨洋","赵磊","孙丽","周杰","吴敏"];
const TOPICS = ["报销流程","VPN 接入","入职指引","请假制度","代码评审","发布流程","安全规范","差旅标准","会议纪要模板","绩效考核"];
let arts = TOPICS.map((t, i) => ({
  id: "KB-" + (101 + i),
  topic: t,
  owner: OWNERS[Math.floor(rnd()*OWNERS.length)],
  date: `2026-0${1+Math.floor(rnd()*8)}-${String(1+Math.floor(rnd()*28)).padStart(2,"0")}`,
  views: Math.floor(rnd()*900)+50
}));
window.__truth = arts;
const div = document.getElementById("arts");
arts.forEach(a => {
  const d = document.createElement("div");
  d.innerHTML = `<h3>${a.id} ${a.topic}</h3><p>负责人: ${a.owner} | 更新日期: ${a.date} | 阅读量: ${a.views}</p>`;
  div.appendChild(d);
});
</script></body></html>
