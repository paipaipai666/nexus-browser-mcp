<!DOCTYPE html><html><head><meta charset="utf-8"><title>运营仪表盘</title></head><body>
<h1>运营仪表盘</h1>
<div id="cards" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"></div>
<script>
const seed = parseInt(new URLSearchParams(location.search).get("seed") || "1");
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(seed);
const METRICS = ["日活用户","新增注册","订单量","客单价","转化率","退单率","在线人数","客服工单","库存预警","活跃商家","广告消耗","毛利额"];
let mets = METRICS.map(m => ({m, v: Math.floor(rnd()*9000)+100, d: (rnd()*20-10).toFixed(1)}));
window.__truth = mets;
const div = document.getElementById("cards");
mets.forEach(x => {
  const d = document.createElement("div");
  d.style.cssText = "border:1px solid #ccc;padding:8px";
  d.innerHTML = `<b>${x.m}</b><div style="font-size:24px">${x.v}</div><span>环比 ${x.d}%</span>`;
  div.appendChild(d);
});
</script></body></html>
