<!DOCTYPE html><html><head><meta charset="utf-8"><title>drag</title></head><body>
<div id="src" draggable="true" style="width:80px;height:30px;background:#ccc">拖我</div>
<div id="zone" style="width:200px;height:80px;border:2px dashed #999">放到这</div>
<div id="done" style="display:none">DROPPED</div>
<script>
const z = document.getElementById("zone");
z.addEventListener("dragover", (e) => e.preventDefault());
z.addEventListener("drop", (e) => { e.preventDefault(); document.getElementById("done").style.display = "block"; });
</script></body></html>
