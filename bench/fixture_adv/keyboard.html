<!DOCTYPE html><html><head><meta charset="utf-8"><title>keyboard</title></head><body>
<button id="open">打开弹窗</button>
<div id="modal" style="display:none">模态框(仅 Escape 可关)</div>
<div id="done" style="display:none">ESCAPED</div>
<script>
// 对抗设计: 没有关闭按钮, 只有 Escape 键能关
document.getElementById("open").addEventListener("click", () => {
  document.getElementById("modal").style.display = "block";
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.getElementById("modal").style.display === "block") {
    document.getElementById("modal").style.display = "none";
    document.getElementById("done").style.display = "block";
  }
});
</script></body></html>
