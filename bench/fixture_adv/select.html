<!DOCTYPE html><html><head><meta charset="utf-8"><title>select</title></head><body>
<label for="city">城市</label>
<select id="city"><option>北京</option><option>上海</option><option>深圳</option></select>
<div id="done" style="display:none">SELECTED-SH</div>
<script>
document.getElementById("city").addEventListener("change", (e) => {
  if (e.target.value === "上海") document.getElementById("done").style.display = "block";
});
</script></body></html>
