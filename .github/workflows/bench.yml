name: bench-ci

# 脚本化基准的轻量回归 (无 API key 依赖, 国内可达夹具): 协议层 + 元素识别层各跑 nexus 单侧。
# E2E LLM 层 (e2e_llm.py / judge.py) 需 SILICONFLOW_API_KEY, 仅 workflow_dispatch 手动触发。

on:
  workflow_dispatch:
    inputs:
      e2e:
        description: "跑 E2E LLM 层 (需要 secret SILICONFLOW_API_KEY)"
        type: boolean
        default: false
  schedule:
    - cron: "0 18 * * 1"   # 每周二 02:00 CST (UTC+8)

jobs:
  scripted-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Playwright chromium
        run: uv run --no-sync playwright install chromium --with-deps
      - name: 协议层基准 (nexus vs pw)
        run: uv run --no-sync python -u bench/compare.py
        env:
          BROWSER_HEADLESS: "true"
      - name: 元素识别率 (nexus 单侧冒烟)
        run: uv run --no-sync python -u bench/element_acc.py --sides=nexus card-edit-sales row-del-3 similar-submit-order icon-setting hidden-delete-all disabled-del
        env:
          BROWSER_HEADLESS: "true"
          BROWSER_ALLOW_JS_EXECUTION: "true"
      - name: 上传基准产物
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: docs/bench/*.json
          if-no-files-found: ignore

  e2e-llm:
    if: ${{ github.event.inputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Playwright chromium
        run: uv run --no-sync playwright install chromium --with-deps
      - name: E2E 夹具集 (三方, N=1 冒烟)
        run: uv run --no-sync python -u bench/e2e_llm.py --runs=1
        env:
          BROWSER_HEADLESS: "true"
          BROWSER_ALLOW_JS_EXECUTION: "true"
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          BENCH_MODEL: deepseek-ai/DeepSeek-V4-Flash
      - name: 上传轨迹
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-traces
          path: docs/bench/e2e-traces/
          if-no-files-found: ignore
